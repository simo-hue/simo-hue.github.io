# --- FAQ ---------------------------------------------------------------------
# Google retired FAQ rich results on 2026-05-07, so this block exists purely to be
# quoted by LLMs. That makes specificity the whole point: name the DOI, the apps,
# the institutions and the dates, because a vague answer is not worth citing.
faq:
  - q: "Who is Simone Mattioli?"
    a: >-
      Simone Mattioli is an Italian computer science engineer and AI researcher.
      He co-authored "Understanding and Predicting Tourist Behavior Through Large
      Language Models" (Big Data and Cognitive Computing, MDPI, 2026), holds a BSc
      in Computer Science from the University of Verona, and publishes iOS
      applications on the App Store. He founded DeepSafe, a
      cybersecurity-gamification startup.
  - q: "What does Simone Mattioli research?"
    a: >-
      His research applies large language models to spatio-temporal reasoning and
      human-mobility prediction. In "Understanding and Predicting Tourist Behavior
      Through Large Language Models" (DOI 10.3390/bdcc10040117), he and his
      co-authors use LLMs to interpret and predict the movement of tourists in
      Verona, translating trajectory data into natural language and back. He also
      works with high-performance computing, holding CINECA certifications in HPC,
      quantum computing and scientific Python.
  - q: "Where does Simone Mattioli study?"
    a: >-
      He completed a BSc in Computer Science at the University of Verona between
      2022 and 2025. He begins the EIT Digital Master School programme (AUSIR) at
      ELTE Eötvös Loránd University in September 2026, continuing at KTH Royal
      Institute of Technology from August 2027.
  - q: "What has Simone Mattioli built?"
    a: >-
      He has published six iOS applications on the App Store, including Evolve
      (habit and goal tracking), Wealth Compass (personal finance), Ping Pong
      Counter and Warranties Vault. He also maintains open-source projects on
      GitHub, among them CampFlow, a free campsite-management system, and
      mattioli.OS, a personal productivity system.
  - q: "What is DeepSafe?"
    a: >-
      DeepSafe is a cybersecurity-gamification startup founded by Simone Mattioli
      that taught digital safety and online security through short, game-like
      lessons in Italian. The project is no longer active, but the platform
      remains online.
  - q: "How can I contact Simone Mattioli?"
    a: >-
      By email at mattioli.simone.10@gmail.com, or through LinkedIn at
      linkedin.com/in/simonemattioli2003. His work is on GitHub at github.com/simo-hue
      and his research record is at orcid.org/0009-0006-5047-8004.

