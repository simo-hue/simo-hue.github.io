  BSc Computer Science, University of Verona (2022–2025). Current EIT Digital
  Master's student in Autonomous Systems and Intelligent Robots (AUSIR) at ELTE
  since September 2026, with a planned second year at KTH Royal Institute of
  Technology starting August 2027.

positioning: >-
  Italian software developer and AI enthusiast. Computer Science graduate and
  EIT Digital Master's student at ELTE, studying Autonomous Systems and
  Intelligent Robots. Co-author of a paper on LLMs for tourist-mobility prediction
  and developer of iOS applications.

description: >-
  Simone Mattioli is an Italian software developer and AI enthusiast interested
  in machine learning, deep learning and neural networks. He holds a BSc in
  Computer Science from the University of Verona and currently studies
  Autonomous Systems and Intelligent Robots through the EIT Digital Master's
  programme at ELTE. His second year at KTH Royal Institute of Technology is
  planned to start in August 2027. He co-authored "Understanding and Predicting
  Tourist Behavior Through Large Language Models" (Big Data and Cognitive
  Computing, 2026), publishes iOS applications, and founded DeepSafe, a
  cybersecurity-gamification project that is no longer active.

