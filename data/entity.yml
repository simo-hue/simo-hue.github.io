#      in about.yml. If you find yourself adding a CSS class here, stop.
#   2. `id` MUST stay byte-identical everywhere and MUST stay language-neutral.
#      On the Italian pages it is still https://simo-hue.github.io/#person —
#      never /it/#person, or the entity splits in two.
#   3. Never state a credential earlier than it is true. See `status` below.
# ─────────────────────────────────────────────────────────────────────────────

