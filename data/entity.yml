# --- Status ------------------------------------------------------------------
# CAREFUL. As of August 2026 he has GRADUATED from Verona and has NOT yet started
# the master's: ELTE begins September 2026, KTH August 2027. Several surfaces used
# to claim he was already at KTH. Claiming a credential before it is true is the
# same failure mode as the "Dr." that SciProfiles wrongly asserts — and on a
# profile whose whole value is academic credibility it is the most damaging kind
# of error. Update the wording when each date actually arrives.
status: >-
  BSc Computer Science, University of Verona (2022–2025). Incoming EIT Digital
  Master's student (AUSIR) — ELTE from September 2026, KTH Royal Institute of
  Technology from August 2027.

positioning: >-
  Italian CS engineer and AI researcher who ships. Co-author of a BDCC/MDPI paper
  on LLMs for tourist-mobility prediction; incoming EIT Digital Master's student
  at ELTE then KTH; six iOS apps on the App Store; founder of DeepSafe.

description: >-
  Simone Mattioli is an Italian computer science engineer and AI researcher. He
  co-authored "Understanding and Predicting Tourist Behavior Through Large
  Language Models" (Big Data and Cognitive Computing, 2026), which uses large
  language models to interpret and predict tourist movement in Verona. He holds a
  BSc in Computer Science from the University of Verona and begins the EIT Digital
  Master's programme at ELTE in September 2026, continuing at KTH Royal Institute
  of Technology in August 2027. Alongside his research he publishes iOS
  applications on the App Store and founded DeepSafe, a cybersecurity-gamification
  startup.

