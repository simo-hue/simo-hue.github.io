name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.final_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          HUGO_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          hugo --gc --minify --baseURL "https://simo-hue.github.io/"
      - name: Validate generated SEO metadata
        run: npm run test:seo
      - name: Validate search and page script behavior
        run: |
          npm run test:search
          npm run test:scripts
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub can briefly fail to list a successfully uploaded artifact.
      # Retry deployment itself: REST API visibility does not guarantee readiness.
      # https://github.com/actions/deploy-pages/issues/451
      - name: Wait before retrying Pages deployment
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - name: Retry failed Pages deployment
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        id: retry
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before final Pages deployment attempt
        if: ${{ !cancelled() && steps.retry.outcome == 'failure' }}
        run: sleep 60
      - name: Final Pages deployment attempt
        if: ${{ !cancelled() && steps.retry.outcome == 'failure' }}
        id: final_retry
        uses: actions/deploy-pages@v4
